openapi: 3.0.3
info:
  title: US Vibe API
  version: 1.0.0
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  service:
                    type: string
  /health/db:
    get:
      summary: PostgreSQL connectivity check
      responses:
        "200":
          description: Database reachability result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  database:
                    type: string
                    enum: [up, down]
