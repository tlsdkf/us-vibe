openapi: 3.0.3
info:
  title: US Vibe API
  version: 1.0.0
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  service:
                    type: string
  /auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /auth/login:
    post:
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /project-state:
    get:
      summary: Get current user's project state (SSOT)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current project state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectState"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    put:
      summary: Replace project state with optimistic concurrency
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutProjectStateRequest"
      responses:
        "200":
          description: State updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectState"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: stateVersion mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UserPublic:
      type: object
      required:
        - id
        - email
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    AuthResponse:
      type: object
      required:
        - user
        - accessToken
      properties:
        user:
          $ref: "#/components/schemas/UserPublic"
        accessToken:
          type: string
    ErrorBody:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    ProjectState:
      type: object
      required:
        - stateVersion
        - approvedRequirements
        - rejectedDecisions
        - openQuestions
        - currentApiSpecs
      properties:
        stateVersion:
          type: integer
          minimum: 1
        approvedRequirements:
          type: array
          items:
            type: string
        rejectedDecisions:
          type: array
          items:
            type: string
        openQuestions:
          type: array
          items:
            type: string
        currentApiSpecs:
          type: array
          items:
            type: string
    PutProjectStateRequest:
      type: object
      required:
        - stateVersion
        - approvedRequirements
        - rejectedDecisions
        - openQuestions
        - currentApiSpecs
      properties:
        stateVersion:
          type: integer
          minimum: 1
          description: Expected current version; server increments on success
        approvedRequirements:
          type: array
          items:
            type: string
        rejectedDecisions:
          type: array
          items:
            type: string
        openQuestions:
          type: array
          items:
            type: string
        currentApiSpecs:
          type: array
          items:
            type: string
